name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — testes, cobertura e domínio
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sga
          POSTGRES_USER: sga
          POSTGRES_PASSWORD: segredo_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sga -d sga"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: sga
      DB_USERNAME: sga
      DB_PASSWORD: segredo_local

    steps:
      - uses: actions/checkout@v4

      - name: Verificação do domínio sem dependências
        run: php verificar-dominio.php

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, zip, intl, opcache, pcov
          coverage: pcov

      - name: Instalar dependências (Composer)
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Preparar ambiente
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          # base de teste dedicada, para nao herdar o problema dos tipos
          # ENUM do Postgres que o migrate:fresh nao remove (ver docs/fase5-testes.md)
          PGPASSWORD=segredo_local psql -h 127.0.0.1 -U sga -d postgres -c "CREATE DATABASE sga_test;"

      - name: Migrar a base de dados
        working-directory: backend
        run: php artisan migrate --force

      - name: Estilo de código (Pint)
        working-directory: backend
        run: ./vendor/bin/pint --test

      - name: Análise estática (Larastan/PHPStan)
        working-directory: backend
        run: ./vendor/bin/phpstan analyse --memory-limit=512M

      - name: Testes de arquitectura, unitários e de integração, com cobertura
        working-directory: backend
        env:
          DB_DATABASE: sga_test
        run: ./vendor/bin/pest --coverage --min=70

  frontend:
    name: Frontend — lint, testes e build de produção
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Estilo de código (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Testes (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build de produção
        working-directory: frontend
        run: npm run build
