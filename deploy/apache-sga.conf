# Apache -> SGA (VPS).
#
# A stack do SGA corre em Docker e escuta apenas em 127.0.0.1:8100
# (docker-compose.prod.yml). Este vhost e a unica porta de entrada a partir
# da internet: termina o TLS e encaminha em HTTP puro para o contentor.
#
# Nao mexe em nenhum outro vhost da VPS -- e um ficheiro novo e
# independente dos projectos que ja la estao.
#
# Instalacao (uma vez):
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo cp deploy/apache-sga.conf /etc/apache2/sites-available/sga.conf
#   sudo sed -i 's/api.SEU-DOMINIO.com/api.oteudominio.com/g' /etc/apache2/sites-available/sga.conf
#   sudo a2ensite sga && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d api.oteudominio.com
#
# O certbot reescreve este ficheiro sozinho: cria o bloco :443 com os
# certificados e converte o :80 num redireccionamento. Depois disso, nao
# voltar a copiar este ficheiro por cima.

<VirtualHost *:80>
    ServerName api.SEU-DOMINIO.com

    ErrorLog  ${APACHE_LOG_DIR}/sga-error.log
    CustomLog ${APACHE_LOG_DIR}/sga-access.log combined

    # Preserva o Host original para o Laravel gerar URLs correctos.
    ProxyPreserveHost On
    # Impede que o Apache aceite pedidos de proxy para destinos arbitrarios.
    ProxyRequests Off

    # Sem isto o Laravel julga estar a servir em http:// (o TLS termina
    # aqui, e o contentor so ve HTTP). Ver trustProxies em bootstrap/app.php.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    ProxyPass        / http://127.0.0.1:8100/ timeout=90
    ProxyPassReverse / http://127.0.0.1:8100/
</VirtualHost>
