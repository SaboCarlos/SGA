; Afinacao de PHP para producao (RNF-09, RNF-27).
; Em desenvolvimento nao e aplicado -- so a imagem api.prod.Dockerfile o copia.

opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; O codigo e imutavel dentro da imagem: nao vale a pena verificar timestamps.
opcache.validate_timestamps=0

expose_php=Off
display_errors=Off
log_errors=On
error_log=/dev/stderr

memory_limit=256M
post_max_size=8M
upload_max_filesize=8M
max_execution_time=60
