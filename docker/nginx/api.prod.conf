# Nginx de producao -- serve APENAS a API.
#
# Em desenvolvimento (docker/nginx/default.conf) este proxy tambem
# encaminhava "/" para o contentor do frontend. Em producao o frontend vive
# no Vercel, por isso aqui so existe o Laravel.
#
# Este nginx nao termina TLS: o Apache do host faz isso e encaminha em
# HTTP puro para 127.0.0.1. Ver deploy/apache-sga.conf.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Cabecalhos de seguranca (RNF-09, OWASP A05)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;
    server_tokens off;

    # Ver comentario em docker/nginx/default.conf: com um literal fixo o
    # nginx resolveria "api" uma unica vez, ao arrancar, e devolveria 502
    # depois de a API ser reconstruida.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $api_upstream api:9000;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Sem isto o Laravel gera URLs http:// mesmo com o Apache a servir
        # em https, porque o TLS termina antes de chegar aqui.
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_read_timeout 90s;
    }

    # Ficheiros ocultos (.env, .git) nunca sao servidos.
    location ~ /\. {
        deny all;
    }
}
