server {
    listen 80;
    server_name _;

    # Cabecalhos de seguranca (RNF-09, OWASP A05)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;

    # DNS embutido do Docker: com proxy_pass/fastcgi_pass num literal fixo,
    # o nginx resolve "api"/"frontend" uma unica vez, ao arrancar. Se esses
    # contentores forem depois reconstruidos sozinhos (ex.: durante o
    # desenvolvimento do frontend), ficam com IP novo e o proxy passa a
    # devolver 502 ate ser reiniciado. Usar variavel + resolver forca a
    # resolver de novo em cada pedido.
    resolver 127.0.0.11 valid=10s;

    # API
    # O fallback do try_files (/index.php) sai do prefixo /api/, por isso o
    # handler PHP tem de ser uma location de topo: se ficasse aninhado dentro
    # de /api/, o redireccionamento interno nunca lhe chegaria e o pedido
    # cairia, em silencio, na location / (proxy para o frontend).
    location /api/ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        set $api_upstream api:9000;
        fastcgi_pass $api_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # SPA
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
